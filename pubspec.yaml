name: myflutter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  sqflite:
  logger: ^2.7.0
  google_fonts: ^6.3.2
  flutter_svg: ^2.2.3
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0
  go_router: ^17.3.0
  firebase_auth: ^6.5.4
  fluttertoast:
  rss_dart: ^1.0.14
  dio: ^5.10.0
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  xml:
  url_launcher: ^6.3.2
  webfeed_plus: ^1.1.2
  intl:
  flutter_launcher_icons: ^0.14.4
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.7.1
  firebase_crashlytics: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.0
  freezed: ^3.2.5
  build_runner:

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/myflutterlogo.png"